<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Countries app</title>
    <link rel="stylesheet" href="./src/styles/main.css" />
  </head>

  <body>
    <div class="container">
      <header class="header">
        <div class="header-content">
          <h1 class="header-title">Country search</h1>
        </div>
      </header>
      <main class="main-content" aria-label="Main content">
        <section
          id="search-section"
          aria-label="Search for countries"
        ></section>
        <div
          id="loading-spinner"
          class="spinner hidden"
          aria-label="Loading"
        ></div>
        <section id="history-section" aria-label="Search history"></section>
        <section
          id="results-section"
          class="results-container"
          aria-label="Search results"
        ></section>
      </main>
      <section id="favorites-section" aria-label="Favorite countries"></section>
    </div>
    <script src="src/app.js" type="module"></script>
  </body>
</html>
